<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Night — Voice (toolkit VoiceCommands)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Voice commands — toolkit</h1>
      <p class="owner">Uses the AI-for-Accessibility Toolkit <code>VoiceCommands</code> adapter from <code>toolkit/</code> and sends shared-protocol events to the bridge.</p>
      <p id="status">Idle</p>
    </header>

    <button type="button" id="listen" class="big">Start listening</button>
    <button type="button" id="settings" class="big">Voice settings</button>
    <pre id="log" aria-live="polite"></pre>

    <h2>Phrases</h2>
    <ul id="phrases"></ul>

    <script type="module" src="toolkit-voice.js"></script>
  </body>
</html>
